name: Target Pokemon monitor

on:
  schedule:
    # Same quarter-hour slots as the JB monitor (see monitor.yml for how the timing works).
    - cron: "53 * * * *"   # -> hh:00:01
    - cron: "8 * * * *"    # -> hh:15:01
    - cron: "23 * * * *"   # -> hh:30:01
    - cron: "38 * * * *"   # -> hh:45:01
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a sample alert instead of a normal run"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state_target.json

concurrency:
  group: target-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          # TARGET_* settings win; if they're unset, the shared JB ones are used.
          TARGET_DISCORD_WEBHOOK_URL: ${{ secrets.TARGET_DISCORD_WEBHOOK_URL }}
          TARGET_DISCORD_BOARD_WEBHOOK_URL: ${{ secrets.TARGET_DISCORD_BOARD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING: ${{ vars.DISCORD_PING }}
          TARGET_INCLUDE_ACCESSORIES: ${{ vars.TARGET_INCLUDE_ACCESSORIES }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python monitor.py --retailer target --test-alert
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python monitor.py --retailer target --at-quarter --schedule "${{ github.event.schedule }}"
          else
            python monitor.py --retailer target   # manual run: check right away
          fi

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state_target.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state_target.json
            git commit -m "Update Target monitor state"
            git pull --rebase
            git push
          fi
